<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuckDB Lakehouse API</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦆</text></svg>">
<style>
  :root {
    --bg: #0f1419; --panel: #171e26; --panel2: #1d2630; --border: #2b3743;
    --text: #dce3ea; --muted: #8394a5; --accent: #ffd166; --accent-text: #201a05;
    --green: #4ade80; --red: #f87171; --blue: #60a5fa; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 12px; }
  input, select, textarea, button { font: inherit; color: var(--text); }
  input, select, textarea { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; outline: none; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--panel2); border-radius: 8px; padding: 8px 14px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 650; }
  button.danger { color: var(--red); }
  button.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  nav { display: flex; gap: 6px; padding: 12px 24px 0; }
  nav button { border: none; background: none; color: var(--muted); padding: 8px 14px; border-bottom: 2px solid transparent; border-radius: 0; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .bar h2 { margin: 0; font-size: 16px; }
  table.grid { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.grid th, table.grid td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.grid th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--panel2); white-space: nowrap; }
  table.grid tr:last-child td { border-bottom: none; }
  .path { font-family: var(--mono); font-size: 12px; color: var(--blue); word-break: break-all; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 16px; }
  .card h3 { margin: 0 0 14px; font-size: 15px; }
  .frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .checkline { display: flex; align-items: center; gap: 8px; }
  .checkline input { width: auto; }
  fieldset { border: 1px dashed var(--border); border-radius: 10px; margin: 0 0 12px; padding: 12px; }
  legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
  .sqlbox { display: block; width: 100%; background: #0b0f13; border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-family: var(--mono); font-size: 12px; color: #a8d08d; overflow-x: auto; white-space: pre-wrap; min-height: 60px; resize: vertical; line-height: 1.6; }
  textarea.sql { font-family: var(--mono); font-size: 13px; min-height: 130px; resize: vertical; }
  .meta { color: var(--muted); font-size: 12px; margin: 10px 0; }
  .error { background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.4); color: var(--red); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }
  .result-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .result-wrap table { border: none; border-radius: 0; }
  .null { color: var(--muted); font-style: italic; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chips button { font-family: var(--mono); font-size: 12px; padding: 3px 10px; border-radius: 20px; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #modal .box { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: min(940px, 92vw); max-height: 84vh; display: flex; flex-direction: column; }
  #modal .box header { border-radius: 14px 14px 0 0; position: static; }
  #modal .body { padding: 16px; overflow: auto; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; z-index: 30; transition: opacity .3s; opacity: 0; pointer-events: none; }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--red); color: var(--red); }
  .hidden { display: none !important; }
  kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>🦆 DuckDB Lakehouse API</h1>
  <span class="tag">GoFrame · DuckDB · httpfs</span>
  <div class="spacer"></div>
  <button class="small" id="btnLang">English</button>
  <label>API Key</label>
  <input id="apiKey" type="password" placeholder="X-API-Key" style="width:200px">
</header>

<nav>
  <button id="tabTables" class="active" data-i18n="nav_tables"></button>
  <button id="tabSQL" data-i18n="nav_sql"></button>
</nav>

<main>
  <!-- ============ Tables ============ -->
  <section id="viewTables">
    <div class="bar">
      <h2 data-i18n="tables_title"></h2>
      <button class="primary" id="btnAdd" data-i18n="btn_add"></button>
    </div>
    <table class="grid">
      <thead><tr>
        <th data-i18n="th_name"></th><th data-i18n="th_format"></th>
        <th data-i18n="th_path"></th><th data-i18n="th_updated"></th>
        <th style="width:280px" data-i18n="th_actions"></th>
      </tr></thead>
      <tbody id="tableRows"></tbody>
    </table>

    <div class="card hidden" id="formCard">
      <h3 id="formTitle"></h3>
      <div class="frow">
        <div class="field">
          <label data-i18n="lbl_name"></label>
          <input id="fName" placeholder="orders">
        </div>
        <div class="field">
          <label data-i18n="lbl_format"></label>
          <select id="fFormat">
            <option value="parquet">Parquet</option>
            <option value="csv">CSV</option>
            <option value="json">JSON</option>
            <option value="avro">Avro</option>
          </select>
        </div>
        <div class="field">
          <label class="checkline" style="margin-top:24px"><input type="checkbox" id="fHive" checked> <span data-i18n="lbl_hive"></span></label>
        </div>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label data-i18n="lbl_path"></label>
        <input id="fPath" placeholder="s3://mybucket/orders/year=*/month=*/*.parquet 或 /local/orders/*.parquet">
        <div class="hint">
          <span data-i18n="hint_path"></span>
          <input type="file" id="fUpload" accept=".parquet,.csv,.json,.avro,.csv.gz,.json.gz,.jsonl,.ndjson" style="display:none">
          <button type="button" class="small" id="btnUpload" data-i18n="btn_upload"></button>
          <span id="uploadMsg"></span>
        </div>
      </div>
      <fieldset id="s3Fields">
        <legend data-i18n="s3_legend"></legend>
        <div class="frow">
          <div class="field"><label>Region *</label><input id="fRegion" placeholder="ap-southeast-2"></div>
          <div class="field"><label>Access Key ID *</label><input id="fKeyId" autocomplete="off"></div>
          <div class="field"><label>Secret Access Key *</label><input id="fSecret" type="password" autocomplete="new-password"></div>
        </div>
        <div class="frow">
          <div class="field">
            <label data-i18n="lbl_endpoint"></label>
            <input id="fEndpoint" placeholder="minio:9000 / <account>.r2.cloudflarestorage.com">
            <div class="hint" data-i18n="hint_endpoint"></div>
          </div>
          <div class="field">
            <label data-i18n="lbl_urlstyle"></label>
            <select id="fUrlStyle">
              <option value="" data-i18n="opt_default"></option>
              <option value="vhost">vhost</option>
              <option value="path" data-i18n="opt_path_minio"></option>
            </select>
          </div>
        </div>
      </fieldset>
      <div class="field" style="margin-bottom:12px">
        <label style="display:flex; align-items:center; gap:10px">
          <span data-i18n="lbl_sql"></span>
          <span class="tag hidden" id="sqlDirtyTag" data-i18n="tag_sql_dirty"></span>
          <button type="button" class="small hidden" id="btnRegenSQL" data-i18n="btn_regen"></button>
        </label>
        <textarea id="sqlPreview" class="sqlbox" spellcheck="false" rows="8"></textarea>
        <div class="hint" data-i18n="hint_sql"></div>
      </div>
      <div style="display:flex; gap:10px">
        <button class="primary" id="btnSave" data-i18n="btn_save"></button>
        <button id="btnCancel" data-i18n="btn_cancel"></button>
        <span class="meta" id="formMsg"></span>
      </div>
    </div>
  </section>

  <!-- ============ SQL Console ============ -->
  <section id="viewSQL" class="hidden">
    <div class="bar">
      <h2 data-i18n="sql_title"></h2>
      <span class="meta"><span data-i18n="sql_shortcut_pre"></span> <kbd>⌘/Ctrl + Enter</kbd> <span data-i18n="sql_shortcut_post"></span></span>
    </div>
    <div class="chips" id="tableChips"></div>
    <textarea id="sqlInput" class="sql" spellcheck="false">SELECT 1 AS hello, version() AS duckdb_version;</textarea>
    <div style="margin-top:10px; display:flex; gap:10px; align-items:center">
      <button class="primary" id="btnRun" data-i18n="btn_run"></button>
      <span class="meta" id="sqlMeta"></span>
    </div>
    <div id="sqlError" class="error hidden"></div>
    <div id="sqlResult" style="margin-top:12px"></div>
  </section>
</main>

<div id="modal" class="hidden">
  <div class="box">
    <header><h1 id="modalTitle" style="font-size:15px"></h1><div class="spacer"></div><button class="small" id="modalClose" data-i18n="modal_close"></button></header>
    <div class="body" id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);

/* ============================ i18n ============================ */
const I18N = {
  zh: {
    lang_switch: 'English',
    nav_tables: '数据表',
    nav_sql: 'SQL 控制台',
    tables_title: '已注册的表(DuckDB 视图)',
    btn_add: '＋ 添加表',
    th_name: '表名', th_format: '格式', th_path: '数据源路径', th_updated: '更新时间', th_actions: '操作',
    loading: '加载中…',
    empty_tables: '还没有表,点击右上角「添加表」注册第一个数据源',
    load_failed: '加载失败:{0}(检查右上角 API Key)',
    btn_schema: '结构', btn_preview: '预览', btn_edit: '编辑', btn_delete: '删除',
    form_add_title: '添加表',
    form_edit_title: '编辑表:{0}',
    lbl_name: '表名 *', lbl_format: '数据格式', lbl_hive: 'Hive 分区 (year=*/month=*)',
    lbl_path: '数据源路径 *',
    hint_path: '支持 s3://(需要下方凭证)、https://,以及容器内本地文件:宿主机 ./localdata(可在 .env 改)已挂载为 /local,支持 * 通配符和 Hive 分区目录。也可以直接上传文件到 /local:',
    btn_upload: '📤 上传文件',
    s3_legend: 'S3 / R2 / MinIO 凭证(仅 s3:// 路径需要)',
    lbl_endpoint: 'Endpoint(可选,自定义 S3 服务)',
    hint_endpoint: '不带 http(s):// 前缀;留空则使用 AWS',
    lbl_urlstyle: 'URL Style(可选)',
    opt_default: '默认', opt_path_minio: 'path(MinIO 常用)',
    lbl_sql: '等效 DuckDB SQL',
    tag_sql_dirty: '已手动编辑,保存时将按此 SQL 执行',
    btn_regen: '↺ 重新生成',
    hint_sql: "可直接编辑此 SQL,「保存并验证」会按编辑后的语句执行并校验(密钥可保留 '********' 占位,执行时自动替换为已保存的密钥)",
    btn_save: '保存并验证', btn_cancel: '取消',
    msg_validating: '正在通过 DuckDB 验证数据源…',
    toast_saved: '已保存,数据源验证通过 ✓',
    sql_ph_init: '-- 填写上方字段后自动生成',
    sql_ph_need: '-- 填写表名和路径后自动生成',
    secret_unchanged: '(留空则保持不变)',
    uploading: '上传中 {0}…',
    uploaded: '已上传 ✓ ({0} KB)',
    upload_failed: '上传失败:{0}',
    confirm_delete: '确定删除表 "{0}"?(只删除注册信息,不会动数据本身)',
    toast_deleted: '已删除 {0}',
    modal_schema: '表结构:{0}',
    modal_preview: '数据预览:{0}(前 50 行)',
    modal_close: '关闭 ✕',
    no_result: '无结果',
    rows_ms: '{0} 行 · {1} ms',
    sql_title: 'SQL 控制台(只读)',
    sql_shortcut_pre: '快捷键', sql_shortcut_post: '运行',
    no_tables_chip: '暂无已注册的表',
    btn_run: '▶ 运行',
    running: '运行中…',
    result_meta: '{0} 行{1} · {2} ms',
    truncated: '(已截断)',
  },
  en: {
    lang_switch: '中文',
    nav_tables: 'Tables',
    nav_sql: 'SQL Console',
    tables_title: 'Registered tables (DuckDB views)',
    btn_add: '＋ Add table',
    th_name: 'Name', th_format: 'Format', th_path: 'Source path', th_updated: 'Updated', th_actions: 'Actions',
    loading: 'Loading…',
    empty_tables: 'No tables yet — click "Add table" to register your first data source',
    load_failed: 'Failed to load: {0} (check the API Key at the top right)',
    btn_schema: 'Schema', btn_preview: 'Preview', btn_edit: 'Edit', btn_delete: 'Delete',
    form_add_title: 'Add table',
    form_edit_title: 'Edit table: {0}',
    lbl_name: 'Table name *', lbl_format: 'Format', lbl_hive: 'Hive partitioning (year=*/month=*)',
    lbl_path: 'Source path *',
    hint_path: 'Supports s3:// (credentials below), https://, and local files inside the container: ./localdata on the Docker host (configurable via .env) is mounted as /local; * globs and Hive-partitioned directories work. You can also upload a file straight to /local:',
    btn_upload: '📤 Upload file',
    s3_legend: 'S3 / R2 / MinIO credentials (only for s3:// paths)',
    lbl_endpoint: 'Endpoint (optional, custom S3 service)',
    hint_endpoint: 'Host[:port] without http(s):// prefix; leave empty for AWS',
    lbl_urlstyle: 'URL Style (optional)',
    opt_default: 'Default', opt_path_minio: 'path (common for MinIO)',
    lbl_sql: 'Equivalent DuckDB SQL',
    tag_sql_dirty: 'Manually edited — this SQL runs on save',
    btn_regen: '↺ Regenerate',
    hint_sql: "You can edit this SQL directly — Save & Validate executes your edited statements and verifies the result (keep the '********' placeholders for secrets; they are replaced with the stored credentials at execution time)",
    btn_save: 'Save & Validate', btn_cancel: 'Cancel',
    msg_validating: 'Validating the data source via DuckDB…',
    toast_saved: 'Saved — data source validated ✓',
    sql_ph_init: '-- Generated automatically once the fields above are filled',
    sql_ph_need: '-- Fill in table name and path to generate',
    secret_unchanged: '(leave empty to keep unchanged)',
    uploading: 'Uploading {0}…',
    uploaded: 'Uploaded ✓ ({0} KB)',
    upload_failed: 'Upload failed: {0}',
    confirm_delete: 'Delete table "{0}"? (Only removes the registration; the data itself is untouched)',
    toast_deleted: 'Deleted {0}',
    modal_schema: 'Schema: {0}',
    modal_preview: 'Preview: {0} (first 50 rows)',
    modal_close: 'Close ✕',
    no_result: 'No results',
    rows_ms: '{0} rows · {1} ms',
    sql_title: 'SQL Console (read-only)',
    sql_shortcut_pre: 'Press', sql_shortcut_post: 'to run',
    no_tables_chip: 'No registered tables yet',
    btn_run: '▶ Run',
    running: 'Running…',
    result_meta: '{0} rows{1} · {2} ms',
    truncated: ' (truncated)',
  },
};

let lang = localStorage.getItem('duckdb_lang') || ((navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en');
if (!I18N[lang]) lang = 'zh';

function t(key, ...args) {
  let s = (I18N[lang] && I18N[lang][key]) ?? I18N.zh[key] ?? key;
  return s.replace(/\{(\d)\}/g, (_, i) => args[i] ?? '');
}

function applyI18n() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#btnLang').textContent = t('lang_switch');
}

$('#btnLang').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('duckdb_lang', lang);
  applyI18n();
  loadTables();          // re-render dynamic rows/buttons
  renderChips();
  if (!sqlDirty && ($('#sqlPreview').value.startsWith('--') || !$('#sqlPreview').value)) {
    $('#sqlPreview').value = t('sql_ph_init');
  }
};

/* ============================ app ============================ */
const apiKeyInput = $('#apiKey');
apiKeyInput.value = localStorage.getItem('duckdb_api_key') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('duckdb_api_key', apiKeyInput.value));

let editingName = null;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKeyInput.value, ...(opts.headers || {}) },
  });
  let body;
  try { body = await res.json(); } catch { body = { code: res.status, message: res.statusText }; }
  if (!res.ok || body.code !== 0) throw new Error(body.message || ('HTTP ' + res.status));
  return body.data;
}

function toast(msg, isErr = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 3200);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- tabs ---------- */
function switchTab(tab) {
  $('#tabTables').classList.toggle('active', tab === 'tables');
  $('#tabSQL').classList.toggle('active', tab === 'sql');
  $('#viewTables').classList.toggle('hidden', tab !== 'tables');
  $('#viewSQL').classList.toggle('hidden', tab !== 'sql');
}
$('#tabTables').onclick = () => switchTab('tables');
$('#tabSQL').onclick = () => { switchTab('sql'); renderChips(); };

/* ---------- tables list ---------- */
let tablesCache = [];

async function loadTables() {
  const tbody = $('#tableRows');
  tbody.innerHTML = `<tr><td colspan="5" class="empty">${t('loading')}</td></tr>`;
  try {
    const data = await api('/tables');
    tablesCache = data.tables || [];
    if (!tablesCache.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">${esc(t('empty_tables'))}</td></tr>`;
      return;
    }
    tbody.innerHTML = tablesCache.map(tb => `
      <tr>
        <td><b>${esc(tb.name)}</b>${tb.hive_partitioning ? ' <span class="tag">hive</span>' : ''}${tb.custom_sql ? ' <span class="tag">SQL</span>' : ''}</td>
        <td><span class="tag">${esc(tb.format)}</span></td>
        <td class="path">${esc(tb.path || '')}</td>
        <td class="meta">${tb.updated_at ? esc(tb.updated_at.replace('T',' ').slice(0,19)) : ''}</td>
        <td>
          <button class="small" onclick="showSchema('${esc(tb.name)}')">${esc(t('btn_schema'))}</button>
          <button class="small" onclick="showPreview('${esc(tb.name)}')">${esc(t('btn_preview'))}</button>
          <button class="small" onclick="openEdit('${esc(tb.name)}')">${esc(t('btn_edit'))}</button>
          <button class="small danger" onclick="delTable('${esc(tb.name)}')">${esc(t('btn_delete'))}</button>
        </td>
      </tr>`).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">${esc(t('load_failed', e.message))}</td></tr>`;
  }
}

/* ---------- add / edit form ---------- */
let sqlDirty = false;

function setSqlDirty(v) {
  sqlDirty = v;
  $('#sqlDirtyTag').classList.toggle('hidden', !v);
  $('#btnRegenSQL').classList.toggle('hidden', !v);
}

function formPayload() {
  const path = $('#fPath').value.trim();
  const payload = {
    name: $('#fName').value.trim(),
    format: $('#fFormat').value,
    path,
    hive_partitioning: $('#fHive').checked,
    custom_sql: sqlDirty ? $('#sqlPreview').value : '',
  };
  if (path.toLowerCase().startsWith('s3://')) {
    payload.s3 = {
      region: $('#fRegion').value.trim(),
      access_key_id: $('#fKeyId').value.trim(),
      secret_access_key: $('#fSecret').value,
      endpoint: $('#fEndpoint').value.trim(),
      url_style: $('#fUrlStyle').value,
    };
  }
  return payload;
}

function openForm(title) {
  $('#formTitle').textContent = title;
  $('#formCard').classList.remove('hidden');
  $('#formMsg').textContent = '';
  setSqlDirty(false);
  $('#sqlPreview').value = t('sql_ph_init');
  $('#formCard').scrollIntoView({ behavior: 'smooth' });
}

$('#btnAdd').onclick = () => {
  editingName = null;
  ['fName','fPath','fRegion','fKeyId','fSecret','fEndpoint'].forEach(id => $('#' + id).value = '');
  $('#fFormat').value = 'parquet';
  $('#fUrlStyle').value = '';
  $('#fHive').checked = true;
  $('#fName').disabled = false;
  $('#fSecret').placeholder = '';
  openForm(t('form_add_title'));
};

async function openEdit(name) {
  try {
    const { table: tb } = await api('/tables/' + name);
    editingName = name;
    $('#fName').value = tb.name; $('#fName').disabled = true;
    $('#fFormat').value = tb.format;
    $('#fPath').value = tb.path || '';
    $('#fHive').checked = !!tb.hive_partitioning;
    $('#fRegion').value = tb.s3?.region || '';
    $('#fKeyId').value = tb.s3?.access_key_id || '';
    $('#fSecret').value = '';
    $('#fSecret').placeholder = tb.s3 ? t('secret_unchanged') : '';
    $('#fEndpoint').value = tb.s3?.endpoint || '';
    $('#fUrlStyle').value = tb.s3?.url_style || '';
    openForm(t('form_edit_title', name));
    if (tb.custom_sql) {
      $('#sqlPreview').value = tb.custom_sql;
      setSqlDirty(true);
    } else {
      refreshSQLPreview();
    }
  } catch (e) { toast(e.message, true); }
}

$('#btnCancel').onclick = () => $('#formCard').classList.add('hidden');

$('#btnSave').onclick = async () => {
  const payload = formPayload();
  $('#formMsg').textContent = t('msg_validating');
  $('#btnSave').disabled = true;
  try {
    if (editingName) await api('/tables/' + editingName, { method: 'PUT', body: JSON.stringify(payload) });
    else await api('/tables', { method: 'POST', body: JSON.stringify(payload) });
    toast(t('toast_saved'));
    $('#formCard').classList.add('hidden');
    loadTables();
  } catch (e) {
    $('#formMsg').textContent = '';
    toast(e.message, true);
  } finally { $('#btnSave').disabled = false; }
};

/* live SQL preview */
let previewTimer;
function refreshSQLPreview() {
  if (sqlDirty) return; // stop auto-overwriting after manual edits
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    if (sqlDirty) return;
    const p = formPayload();
    p.custom_sql = '';
    if (!p.name || !p.path) { $('#sqlPreview').value = t('sql_ph_need'); return; }
    if (p.s3) { p.s3.secret_access_key = p.s3.secret_access_key || '********'; p.s3.access_key_id = p.s3.access_key_id || '<ACCESS_KEY_ID>'; p.s3.region = p.s3.region || '<REGION>'; }
    try {
      const data = await api('/tables/preview-sql', { method: 'POST', body: JSON.stringify(p) });
      if (sqlDirty) return;
      $('#sqlPreview').value = 'INSTALL httpfs;\nLOAD httpfs;\n\n' + data.statements.join(';\n\n') + ';';
    } catch (e) {
      if (!sqlDirty) $('#sqlPreview').value = '-- ' + e.message;
    }
  }, 350);
}
['fName','fFormat','fPath','fHive','fRegion','fKeyId','fSecret','fEndpoint','fUrlStyle'].forEach(id => {
  $('#' + id).addEventListener('input', refreshSQLPreview);
});
$('#sqlPreview').addEventListener('input', () => setSqlDirty(true));
$('#btnRegenSQL').onclick = () => { setSqlDirty(false); refreshSQLPreview(); };

/* upload a data file into /local */
$('#btnUpload').onclick = () => $('#fUpload').click();
$('#fUpload').addEventListener('change', async () => {
  const file = $('#fUpload').files[0];
  if (!file) return;
  $('#uploadMsg').textContent = t('uploading', file.name);
  $('#btnUpload').disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res = await fetch('/api/upload', { method: 'POST', headers: { 'X-API-Key': apiKeyInput.value }, body: fd });
    const body = await res.json();
    if (!res.ok || body.code !== 0) throw new Error(body.message || ('HTTP ' + res.status));
    $('#fPath').value = body.data.path;
    const ext = (body.data.filename.split('.').pop() || '').toLowerCase();
    if (ext === 'csv') $('#fFormat').value = 'csv';
    else if (['json','jsonl','ndjson'].includes(ext)) $('#fFormat').value = 'json';
    else if (ext === 'parquet') $('#fFormat').value = 'parquet';
    else if (ext === 'avro') $('#fFormat').value = 'avro';
    $('#uploadMsg').textContent = t('uploaded', (body.data.size/1024).toFixed(1));
    refreshSQLPreview();
  } catch (e) {
    $('#uploadMsg').textContent = '';
    toast(t('upload_failed', e.message), true);
  } finally {
    $('#btnUpload').disabled = false;
    $('#fUpload').value = '';
  }
});

async function delTable(name) {
  if (!confirm(t('confirm_delete', name))) return;
  try {
    await api('/tables/' + name, { method: 'DELETE' });
    toast(t('toast_deleted', name));
    loadTables();
  } catch (e) { toast(e.message, true); }
}

/* ---------- schema / preview modal ---------- */
function openModal(title) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = `<div class="empty">${t('loading')}</div>`;
  $('#modal').classList.remove('hidden');
}
$('#modalClose').onclick = () => $('#modal').classList.add('hidden');
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.add('hidden'); });

function renderResult(data) {
  if (!data.columns?.length) return `<div class="empty">${esc(t('no_result'))}</div>`;
  const head = data.columns.map((c, i) => `<th>${esc(c)}<br><span class="meta">${esc(data.types?.[i] || '')}</span></th>`).join('');
  const rows = data.rows.map(r => '<tr>' + r.map(v =>
    `<td>${v === null ? '<span class="null">null</span>' : esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td>`
  ).join('') + '</tr>').join('');
  return `<div class="result-wrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function showSchema(name) {
  openModal(t('modal_schema', name));
  try { $('#modalBody').innerHTML = renderResult(await api(`/tables/${name}/schema`)); }
  catch (e) { $('#modalBody').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

async function showPreview(name) {
  openModal(t('modal_preview', name));
  try {
    const data = await api(`/tables/${name}/preview?limit=50`);
    $('#modalBody').innerHTML = `<div class="meta">${esc(t('rows_ms', data.row_count, data.duration_ms))}</div>` + renderResult(data);
  } catch (e) { $('#modalBody').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

/* ---------- SQL console ---------- */
function renderChips() {
  $('#tableChips').innerHTML = tablesCache.map(tb =>
    `<button onclick="insertTable('${esc(tb.name)}')">${esc(tb.name)}</button>`).join('') || `<span class="meta">${esc(t('no_tables_chip'))}</span>`;
}
function insertTable(name) {
  $('#sqlInput').value = `SELECT * FROM "${name}" LIMIT 100;`;
  $('#sqlInput').focus();
}

async function runSQL() {
  const sql = $('#sqlInput').value.trim();
  if (!sql) return;
  $('#btnRun').disabled = true;
  $('#sqlMeta').textContent = t('running');
  $('#sqlError').classList.add('hidden');
  try {
    const data = await api('/query', { method: 'POST', body: JSON.stringify({ sql }) });
    $('#sqlMeta').textContent = t('result_meta', data.row_count, data.truncated ? t('truncated') : '', data.duration_ms);
    $('#sqlResult').innerHTML = renderResult(data);
  } catch (e) {
    $('#sqlMeta').textContent = '';
    $('#sqlResult').innerHTML = '';
    $('#sqlError').textContent = e.message;
    $('#sqlError').classList.remove('hidden');
  } finally { $('#btnRun').disabled = false; }
}
$('#btnRun').onclick = runSQL;
$('#sqlInput').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runSQL(); }
});

applyI18n();
loadTables();
</script>
</body>
</html>
